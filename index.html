<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- GitHub Pages cannot send security headers, so the page asks the browser for the same limits: only this site's
       own scripts and styles run, nothing is fetched from anywhere else, and no forms are sent. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <!-- The link is shared by hand: ask search engines not to list the page. -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#8f1f2e">
  <meta name="description" content="BirdBrain: plan Thanksgiving. Oven schedule, make-ahead checklist and shopping list.">
  <title>BirdBrain · Thanksgiving Planner</title>
  <!-- The browser-tab icon is the turkey logo, written out here so there is no image file to load. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg viewBox='0 0 64 64' xmlns='http://www.w3.org/2000/svg'%3E%3Cg transform='translate(32 40)'%3E%3Cellipse rx='6' ry='20' fill='%238f1f2e' transform='rotate(-72) translate(0 -14)'/%3E%3Cellipse rx='6' ry='20' fill='%23b8480f' transform='rotate(-36) translate(0 -14)'/%3E%3Cellipse rx='6' ry='20' fill='%23e3a21a' transform='translate(0 -14)'/%3E%3Cellipse rx='6' ry='20' fill='%235b7c3a' transform='rotate(36) translate(0 -14)'/%3E%3Cellipse rx='6' ry='20' fill='%23b8480f' transform='rotate(72) translate(0 -14)'/%3E%3C/g%3E%3Ccircle cx='32' cy='42' r='13' fill='%236b3f22'/%3E%3Ccircle cx='32' cy='27' r='8' fill='%237d4a2a'/%3E%3Cpath d='M29 29 L35 29 L32 35 Z' fill='%23f2b632'/%3E%3Cellipse cx='32.5' cy='36' rx='2' ry='3' fill='%23c8202f'/%3E%3C/svg%3E">
  <!-- Relative URLs only: GitHub Pages serves this from /<repo>/ -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/print.css" media="print">
</head>
<body>
  <header class="app-header">
    <div class="app-header-inner">
      <h1 class="brand-wrap"><span class="brand">
        <span class="brand-logo" aria-hidden="true">
          <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
            <g transform="translate(32 40)">
              <ellipse rx="6" ry="20" fill="#8f1f2e" transform="rotate(-72) translate(0 -14)"/>
              <ellipse rx="6" ry="20" fill="#b8480f" transform="rotate(-36) translate(0 -14)"/>
              <ellipse rx="6" ry="20" fill="#e3a21a" transform="translate(0 -14)"/>
              <ellipse rx="6" ry="20" fill="#5b7c3a" transform="rotate(36) translate(0 -14)"/>
              <ellipse rx="6" ry="20" fill="#b8480f" transform="rotate(72) translate(0 -14)"/>
            </g>
            <circle cx="32" cy="42" r="13" fill="#6b3f22"/>
            <circle cx="32" cy="27" r="8" fill="#7d4a2a"/>
            <path d="M29 29 L35 29 L32 35 Z" fill="#f2b632"/>
            <ellipse cx="32.5" cy="36" rx="2" ry="3" fill="#c8202f"/>
            <circle cx="29" cy="25" r="1.4" fill="#fff"/><circle cx="35" cy="25" r="1.4" fill="#fff"/>
            <circle cx="29" cy="25" r=".7" fill="#222"/><circle cx="35" cy="25" r=".7" fill="#222"/>
            <g stroke="#ffe08a" stroke-width="2" stroke-linecap="round"><path d="M32 12 V8"/><path d="M24 15 L21 12"/><path d="M40 15 L43 12"/></g>
          </svg>
        </span>
        <span class="brand-text">
          <span class="brand-name">BirdBrain</span>
          <span class="brand-tag">Because we're all a bit birdbrained</span>
        </span>
      </span></h1>
      <div class="header-side">
        <p id="countdown" class="countdown-pill"></p>
        <button type="button" id="risk-chip" class="risk-chip print-hide" hidden></button>
      </div>
    </div>
  </header>

  <div id="banner" class="banner" role="status" hidden></div>

  <main class="app-main">
    <!-- The first questions. There is no button for this screen; a new plan opens here. -->
    <section id="screen-guide" class="screen" data-screen="guide" aria-labelledby="title-guide" hidden>
      <h2 id="title-guide" class="sr-only">A few questions</h2>
      <div class="screen-body"></div>
    </section>
    <section id="screen-setup" class="screen" data-screen="setup" aria-labelledby="title-setup" hidden>
      <h2 id="title-setup">Setup</h2>
      <div class="screen-body"></div>
    </section>
    <section id="screen-menu" class="screen" data-screen="menu" aria-labelledby="title-menu" hidden>
      <h2 id="title-menu">Dishes</h2>
      <div class="screen-body"></div>
    </section>
    <section id="screen-schedule" class="screen" data-screen="schedule" aria-labelledby="title-schedule" hidden>
      <h2 id="title-schedule">Schedule</h2>
      <div class="screen-body"></div>
    </section>
    <section id="screen-shopping" class="screen" data-screen="shopping" aria-labelledby="title-shopping" hidden>
      <h2 id="title-shopping">Shopping</h2>
      <div class="screen-body"></div>
    </section>
    <section id="screen-notes" class="screen" data-screen="notes" aria-labelledby="title-notes" hidden>
      <h2 id="title-notes">Notes</h2>
      <div class="screen-body"></div>
    </section>
    <section id="screen-cook" class="screen" data-screen="cook" aria-labelledby="title-cook" hidden>
      <h2 id="title-cook">Cook</h2>
      <div class="screen-body"></div>
    </section>
  </main>

  <!-- Pop-up about problems in the plan: filled in by js/ui/risknotice.js -->
  <div id="risk-toast" class="toast print-hide" role="status" aria-live="polite" hidden></div>

  <!-- "Removed. Undo" notices: filled in by js/ui/undo.js -->
  <div id="undo-toast" class="toast undo-toast print-hide" role="status" aria-live="polite" hidden></div>

  <nav class="tab-bar" aria-label="Screens">
    <!-- Line icons written out as SVG, so there are no image files to load -->
    <button type="button" data-tab="setup"><span class="tab-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.4"/><path d="M16 14.2c3 .2 5 2.3 5 5.2"/></svg></span><span>Setup</span></button>
    <button type="button" data-tab="menu"><span class="tab-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="12" r="3.5"/></svg></span><span>Dishes</span></button>
    <button type="button" data-tab="schedule"><span class="tab-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M8 3v4M16 3v4"/></svg></span><span>Schedule</span></button>
    <button type="button" data-tab="shopping"><span class="tab-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 4h2l2.4 11h10.2L20 8H6.2"/><circle cx="9" cy="19" r="1.6"/><circle cx="17" cy="19" r="1.6"/></svg></span><span>Shopping</span></button>
    <button type="button" data-tab="cook"><span class="tab-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="7.5"/><path d="M12 9v4l3 2M9 3h6"/></svg></span><span>Cook</span></button>
    <button type="button" data-tab="notes"><span class="tab-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h7"/></svg></span><span>Notes</span></button>
  </nav>

  <script type="module" src="js/app.js"></script>
</body>
</html>
